<!doctype html>
<html lang="zh-Hant">
<head>

  <style>
    :root {
      --bg: #05070d;
      --panel: rgba(9, 14, 26, .76);
      --panel-strong: rgba(10, 16, 30, .92);
      --line: rgba(127, 214, 255, .18);
      --text: #f4f7fb;
      --muted: #8e9aae;
      --cyan: #78e4ff;
      --violet: #b388ff;
      --gold: #e6bd6f;
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; background: var(--bg); color: var(--text); }
    body {
      min-height: 100vh;
      overflow: hidden;
      font-family: Inter, "Noto Sans TC", "PingFang TC", system-ui, sans-serif;
      background:
        radial-gradient(circle at 50% 44%, rgba(42, 104, 170, .12), transparent 34rem),
        radial-gradient(circle at 15% 10%, rgba(104, 65, 196, .09), transparent 28rem),
        #05070d;
    }
    button, a { font: inherit; }
    .app { position: relative; width: 100vw; height: 100dvh; min-height: 620px; overflow: hidden; }
    #space { position: absolute; inset: 0; width: 100%; height: 100%; display: block; touch-action: none; }

    .hud {
      position: absolute; inset: 0; pointer-events: none;
      padding: max(18px, env(safe-area-inset-top)) max(18px, env(safe-area-inset-right)) max(18px, env(safe-area-inset-bottom)) max(18px, env(safe-area-inset-left));
      display: flex; flex-direction: column; justify-content: space-between;
    }
    .topbar { display: flex; justify-content: space-between; gap: 18px; align-items: flex-start; }
    .brand {
      display: inline-flex; align-items: center; gap: 10px;
      font-size: 11px; font-weight: 800; letter-spacing: .22em; color: #dfe7f2;
      text-transform: uppercase;
      text-shadow: 0 0 18px rgba(120,228,255,.25);
    }
    .brand-mark {
      width: 26px; height: 26px; position: relative; transform: rotate(45deg);
      border: 1px solid rgba(120,228,255,.75); border-radius: 7px;
      box-shadow: inset 0 0 14px rgba(120,228,255,.13), 0 0 18px rgba(120,228,255,.18);
    }
    .brand-mark::after { content: ""; position: absolute; inset: 7px; border: 1px solid rgba(179,136,255,.8); border-radius: 3px; }
    .status {
      text-align: right; color: #7f8da2; font: 700 10px/1.5 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .14em;
    }
    .status b { color: #86f7bf; font-weight: 800; }

    .legend {
      align-self: flex-start;
      width: min(430px, calc(100vw - 36px));
      padding: 13px 15px;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      background: linear-gradient(180deg, rgba(12,18,33,.72), rgba(7,11,22,.44));
      backdrop-filter: blur(14px);
      box-shadow: 0 16px 40px rgba(0,0,0,.18);
      color: #8895a9;
      font-size: 11px; line-height: 1.65;
    }
    .legend strong { color: #eaf2fb; font-size: 12px; }
    .legend .hint { color: #708097; margin-top: 2px; }

    .side-panel {
      position: absolute; right: max(18px, env(safe-area-inset-right)); top: 50%; transform: translateY(-50%);
      width: min(340px, calc(100vw - 36px));
      padding: 20px;
      border: 1px solid rgba(120,228,255,.14);
      border-radius: 22px;
      background: linear-gradient(180deg, rgba(10,16,30,.92), rgba(7,11,22,.82));
      backdrop-filter: blur(18px);
      box-shadow: 0 24px 70px rgba(0,0,0,.42), inset 0 1px rgba(255,255,255,.04);
      opacity: 0; pointer-events: none; translate: 18px 0;

    }
    .side-panel.show { opacity: 1; pointer-events: auto; translate: 0 0; }
    .panel-kicker { color: var(--cyan); font: 800 9px/1 ui-monospace, SFMono-Regular, Menlo, monospace; letter-spacing: .18em; text-transform: uppercase; }
    .side-panel h2 { margin: 10px 0 8px; font-size: clamp(24px, 4vw, 34px); line-height: 1.05; letter-spacing: -.03em; }
    .side-panel p { margin: 0; color: #9aa7b8; font-size: 12px; line-height: 1.75; }
    .panel-meta { display: flex; gap: 8px; flex-wrap: wrap; margin: 15px 0 0; }
    .chip { padding: 7px 9px; border: 1px solid rgba(255,255,255,.09); border-radius: 999px; color: #aeb9c8; font: 700 9px/1 ui-monospace, monospace; letter-spacing: .1em; }
    .panel-actions { display: flex; gap: 9px; margin-top: 18px; }
    .panel-actions a, .panel-actions button {
      min-height: 42px; display: inline-flex; align-items: center; justify-content: center;
      border-radius: 13px; padding: 0 14px; border: 1px solid rgba(255,255,255,.1);
      color: #eaf4ff; text-decoration: none; background: rgba(255,255,255,.045); cursor: pointer;
      font-size: 11px; font-weight: 800; letter-spacing: .08em;
    }
    .panel-actions a.primary { background: rgba(120,228,255,.12); border-color: rgba(120,228,255,.34); color: #9eeeff; }
    .panel-actions button { margin-left: auto; color: #8795a9; }

    .title-center {
      position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%);
      text-align: center; pointer-events: none; width: min(620px, 82vw);
      mix-blend-mode: screen;
    }
    .title-center .micro { color: rgba(166,209,231,.26); font: 800 9px/1 ui-monospace, monospace; letter-spacing: .28em; text-transform: uppercase; }
    .title-center h1 { margin: 8px 0 0; font-size: clamp(32px, 7vw, 72px); line-height: .88; letter-spacing: -.06em; opacity: .035; }

    .scanline {
      position: absolute; inset: 0; pointer-events: none; opacity: .12;
      background: repeating-linear-gradient(to bottom, transparent 0, transparent 3px, rgba(255,255,255,.015) 4px);
      mix-blend-mode: screen;
    }
    .vignette { position: absolute; inset: 0; pointer-events: none; box-shadow: inset 0 0 180px rgba(0,0,0,.78); }

    @media (max-width: 760px) {
      .app { min-height: 560px; }
      .status { display: none; }
      .legend { font-size: 10px; padding: 10px 12px; width: auto; max-width: 85vw; }
      .legend strong { font-size: 11px; }
      .side-panel {
        top: auto; bottom: max(16px, env(safe-area-inset-bottom)); right: 14px; left: 14px; width: auto;
        transform: none; padding: 17px; border-radius: 18px; translate: 0 18px;
      }
      .side-panel.show { translate: 0 0; }
      .side-panel h2 { font-size: 25px; }
      .title-center { top: 48%; }
    }
    @media (prefers-reduced-motion: reduce) {
      .side-panel { transition: none; }
    }
  </style>
</head>
<body>
  <div class="app">
    <canvas id="space" aria-label="Bryce AI Studio 13 個專案互動星際圖"></canvas>
    <div class="title-center" aria-hidden="true"><div class="micro">BRYCE AI STUDIO SYSTEM MAP</div><h1>GAME POOL</h1></div>
    <div class="hud">
      <div class="topbar">
        <div class="brand"><span class="brand-mark" aria-hidden="true"></span>BRYCE AI STUDIO</div>
        <div class="status"><b>● ONLINE</b><br>13 WORLDS / LIVE MAP</div>
      </div>
      <div class="legend"><strong>GAME POOL · 13 PROJECTS</strong><br>拖曳探索星圖，點擊節點查看專案。<div class="hint">可進入的專案會顯示 OPEN / DOWNLOAD。</div></div>
    </div>

    <aside class="side-panel" id="panel" aria-live="polite">
      <div class="panel-kicker" id="panelKicker">PROJECT NODE</div>
      <h2 id="panelTitle">GAME POOL</h2>
      <p id="panelDesc">選擇一個星球，查看專案狀態。</p>
      <div class="panel-meta" id="panelMeta"></div>

      </div>
    </aside>

    <div class="scanline"></div>
    <div class="vignette"></div>
  </div>

  <script>
    const canvas = document.getElementById('space');
    const ctx = canvas.getContext('2d');
    const panel = document.getElementById('panel');
    const panelTitle = document.getElementById('panelTitle');
    const panelDesc = document.getElementById('panelDesc');
    const panelMeta = document.getElementById('panelMeta');
    const panelLink = document.getElementById('panelLink');
    const panelClose = document.getElementById('panelClose');

    const projects = [
      { id:'echo', name:'ECHO', label:'ECHO', short:'心理恐怖互動敘事', type:'PSYCHOLOGICAL HORROR', status:'OPEN', color:'#ff6579', r:1.86, b:1.00, x:-.31, y:-.25, link:'https://brycekuo-proj.github.io/midnight-line-echo/' },
      { id:'fanren', name:'凡人不修仙', label:'凡人不修仙', short:'文字 Roguelike 修仙生存', type:'TEXT ROGUELIKE', status:'OPEN', color:'#e5b86c', r:1.78, b:.98, x:-.02, y:-.34, link:'./fanren.html' },
      { id:'aituber', name:'AITuber', label:'AITuber', short:'跨 AI 角色皮膚與陪伴 Runtime', type:'AI AVATAR', status:'DOWNLOAD', color:'#b58cff', r:1.70, b:.96, x:.28, y:-.25, link:'https://github.com/brycekuo-proj/FanRenBuXiuXian/releases/download/game-pool-apk-20260910/app-debug.apk' },
      { id:'party', name:'Party Cam', label:'Party Cam', short:'真人姿勢與反應挑戰', type:'CAMERA PARTY GAME', status:'DOWNLOAD', color:'#66e2ff', r:1.62, b:.94, x:.38, y:.02, link:'https://github.com/brycekuo-proj/FanRenBuXiuXian/releases/download/game-pool-apk-20260910/PartyCameraGame_cute_jelly_laser_A16_arm64_20260909.apk' },
      { id:'qiyun', name:'氣運復仇者', label:'氣運復仇者', short:'Ghost vs. Fate · 正義角色反轉復仇', type:'ACTION ROGUELITE', status:'DEVELOPMENT', color:'#63b5ff', r:1.72, b:.74, x:.29, y:.31 },
      { id:'mahjong', name:'麻將三國塔防', label:'麻將三國', short:'牌型、武將與塔防策略', type:'STRATEGY TD', status:'DEVELOPMENT', color:'#77dca2', r:1.33, b:.68, x:.02, y:.39 },
      { id:'debt', name:'父債子償：魔王養成', label:'魔王養成', short:'魔王經營、養成與防守入侵者', type:'MANAGEMENT', status:'PLANNED', color:'#e46c91', r:1.26, b:.48, x:-.29, y:.29 },
      { id:'travelers', name:'穿越者大亂鬥', label:'穿越者', short:'橫向動作與多角色能力切換', type:'ACTION GAME', status:'PLANNED', color:'#ff9d66', r:1.22, b:.46, x:-.39, y:.02 },
      { id:'fractured', name:'認知迴廊', label:'認知迴廊', short:'Fractured Perception · 認知錯位探索', type:'EXPERIMENTAL', status:'PLANNED', color:'#7d8cff', r:.92, b:.38, x:-.13, y:-.08 },
      { id:'taoist', name:'道長不要停', label:'道長', short:'輕量化東方題材遊戲實驗', type:'CASUAL GAME', status:'PLANNED', color:'#d6cf70', r:.88, b:.36, x:.14, y:.08 },
      { id:'nim', name:'Nim Game', label:'Nim Game', short:'Dynamic Nim · 可玩的 L1–L10 單人數學策略 Web prototype；移除 1～3 顆連續圓圈、預測重力盤面，對抗 deterministic solver AI。', type:'MATH STRATEGY', status:'PLAYABLE', color:'#6cf0cc', r:1.34, b:.82, x:-.14, y:.16, link:'https://github.com/brycekuo-proj/dynamic-nim' },
      { id:'matchquake', name:'MatchQuake', label:'MatchQuake', short:'火柴建築師 · 物理與建築玩法', type:'PHYSICS PUZZLE', status:'PLANNED', color:'#ffcc72', r:.96, b:.40, x:.07, y:.23 },
      { id:'chickenrabbit', name:'雞兔同龍', label:'雞兔同龍', short:'不同射程單位共同守住防線', type:'DEFENSE GAME', status:'PLANNED', color:'#79b8ff', r:.86, b:.35, x:.06, y:-.18 }
    ];

    let W=0,H=0,DPR=1,cx=0,cy=0,zoom=1,offsetX=0,offsetY=0;
    let stars=[], particles=[], hovered=null, selected=null, dragging=false, moved=false;
    let lastX=0,lastY=0, startX=0,startY=0, t=0;
    const reduceMotion = matchMedia('(prefers-reduced-motion: reduce)').matches;

    function resize(){
      DPR = Math.min(devicePixelRatio || 1, 2);
      W = innerWidth; H = innerHeight;
      canvas.width = Math.round(W*DPR); canvas.height = Math.round(H*DPR);
      canvas.style.width = W+'px'; canvas.style.height = H+'px';
      ctx.setTransform(DPR,0,0,DPR,0,0);
      cx = W*0.5; cy = H*(W<760 ? 0.43 : 0.5);
      const count = Math.max(90, Math.floor(W*H/7000));
      stars = Array.from({length:count},()=>({x:Math.random()*W,y:Math.random()*H,r:Math.random()*1.2+.15,a:Math.random()*.65+.12,s:Math.random()*.4+.1}));
      particles = Array.from({length:34},()=>({a:Math.random()*Math.PI*2,d:Math.random(),s:Math.random()*.004+.0015}));
    }

    function worldScale(){ return Math.min(W*.78, H*(W<760 ? .42 : .56), 520) * zoom; }
    function nodePos(p, now=t){
      const S=worldScale();
      const driftX = reduceMotion ? 0 : Math.sin(now*.00034 + p.x*11 + p.y*7) * 2.4;
      const driftY = reduceMotion ? 0 : Math.cos(now*.00029 + p.x*8 - p.y*13) * 2.0;
      return {
        x:cx+offsetX+p.x*S+driftX,
        y:cy+offsetY+p.y*S*.92+driftY
      };
    }

    function drawStars(now){
      ctx.save();
      for(const s of stars){
        const twinkle = reduceMotion ? s.a : s.a + Math.sin(now*.001*s.s + s.x)*.12;
        ctx.globalAlpha=Math.max(.05,twinkle);
        ctx.fillStyle='#d8edff'; ctx.beginPath(); ctx.arc(s.x,s.y,s.r,0,Math.PI*2); ctx.fill();
      }
      ctx.restore();
    }

    function drawNebula(){
      const g=ctx.createRadialGradient(cx+offsetX,cy+offsetY,0,cx+offsetX,cy+offsetY,Math.min(W,H)*.48);
      g.addColorStop(0,'rgba(75,170,230,.10)'); g.addColorStop(.28,'rgba(57,95,170,.06)'); g.addColorStop(1,'rgba(0,0,0,0)');
      ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
    }

    function drawOrbits(){
      const S=worldScale();
      ctx.save();
      ctx.translate(cx+offsetX,cy+offsetY);
      ctx.strokeStyle='rgba(116,203,255,.055)';
      ctx.lineWidth=1;
      ctx.setLineDash([2,9]);
      ctx.beginPath();
      ctx.ellipse(0,0,S*.48,S*.43,0,0,Math.PI*2);
      ctx.stroke();
      ctx.setLineDash([]);
      ctx.restore();
    }

    function drawCore(now){
      const x=cx+offsetX, y=cy+offsetY;
      const pulse=reduceMotion?1:1+Math.sin(now*.0022)*.04;
      const coreR=W<760?13:17;
      const rg=ctx.createRadialGradient(x,y,0,x,y,coreR*4.6*pulse);
      rg.addColorStop(0,'rgba(255,255,255,.98)'); rg.addColorStop(.17,'rgba(154,233,255,.88)'); rg.addColorStop(.46,'rgba(67,157,220,.25)'); rg.addColorStop(1,'rgba(67,157,220,0)');
      ctx.fillStyle=rg; ctx.beginPath(); ctx.arc(x,y,coreR*4.6*pulse,0,Math.PI*2); ctx.fill();
      ctx.strokeStyle='rgba(174,240,255,.38)'; ctx.lineWidth=1; ctx.beginPath(); ctx.ellipse(x,y,coreR*2.7,coreR*.95,now*.00012,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle='#fff'; ctx.beginPath(); ctx.arc(x,y,coreR*pulse,0,Math.PI*2); ctx.fill();
      return {x,y,r:coreR*3};
    }

    function drawConnections(now){
      const coreX=cx+offsetX, coreY=cy+offsetY;
      ctx.save();
      projects.forEach((p,i)=>{
        const q=nodePos(p,now);
        const hot = hovered===p || selected===p;
        ctx.globalAlpha=hot ? .8 : .12 + p.b*.16;
        ctx.strokeStyle=hot ? p.color : '#8edfff';
        ctx.lineWidth=hot?1.25:.55;
        ctx.setLineDash(hot?[3,5]:[1,8]);
        ctx.beginPath(); ctx.moveTo(coreX,coreY); ctx.lineTo(q.x,q.y); ctx.stroke();
        if(!reduceMotion && (hot || (p.b>.7 && i%2===0))){
          const phase=((now*.00013*(1+(i%4)*.13))+i*.17)%1;
          const px=coreX+(q.x-coreX)*phase, py=coreY+(q.y-coreY)*phase;
          ctx.globalAlpha=hot?.92:.34; ctx.fillStyle=p.color; ctx.beginPath(); ctx.arc(px,py,hot?2.1:1.2,0,Math.PI*2); ctx.fill();
        }
      });
      ctx.restore();
    }

    function wrapLabel(name,max=12){
      if(name.length<=max) return [name];
      const split=Math.ceil(name.length/2); return [name.slice(0,split),name.slice(split)];
    }

    function rgba(hex, alpha){
      const n=parseInt(hex.replace('#',''),16);
      const r=(n>>16)&255, g=(n>>8)&255, b=n&255;
      return `rgba(${r},${g},${b},${alpha})`;
    }

    function drawPlanetBall(x,y,radius,glowBaseRadius,color,brightness,hot,now,seed){
      const pulse = reduceMotion ? 1 : 1 + Math.sin(now*.0018 + seed*.9) * .018;
      const r = radius * pulse;
      // Keep the halo at its previous footprint even though the visible sphere is 50% smaller.
      const glowRadius = glowBaseRadius * pulse * (2.35 + brightness*1.35);

      // Atmospheric glow behind the sphere.
      const halo=ctx.createRadialGradient(x,y,r*.18,x,y,glowRadius);
      halo.addColorStop(0,rgba(color,hot?.72:.28+brightness*.42));
      halo.addColorStop(.28,rgba(color,hot?.28:.07+brightness*.18));
      halo.addColorStop(1,rgba(color,0));
      ctx.fillStyle=halo;
      ctx.beginPath(); ctx.arc(x,y,glowRadius,0,Math.PI*2); ctx.fill();

      ctx.save();
      ctx.beginPath(); ctx.arc(x,y,r,0,Math.PI*2); ctx.clip();

      // Main sphere: small bright source at the upper-left, broad falloff to a dark lower-right limb.
      const drift = reduceMotion ? 0 : Math.sin(now*.00025 + seed) * r*.045;
      const body=ctx.createRadialGradient(
        x-r*.42+drift, y-r*.46-drift*.3, r*.03,
        x+r*.18, y+r*.20, r*1.22
      );
      body.addColorStop(0,'rgba(255,255,255,.98)');
      body.addColorStop(.12,rgba(color,.96));
      body.addColorStop(.48,rgba(color,.90));
      body.addColorStop(.76,rgba(color,.62));
      body.addColorStop(1,'rgba(2,5,12,.92)');
      ctx.globalAlpha=hot?1:.48+brightness*.52;
      ctx.fillStyle=body;
      ctx.fillRect(x-r,y-r,r*2,r*2);

      // Soft terminator gives the sphere a real shaded hemisphere instead of a flat disc.
      const shade=ctx.createRadialGradient(x-r*.30,y-r*.34,r*.15,x+r*.30,y+r*.34,r*1.08);
      shade.addColorStop(0,'rgba(0,0,0,0)');
      shade.addColorStop(.54,'rgba(0,0,0,.02)');
      shade.addColorStop(.80,'rgba(0,0,0,.22)');
      shade.addColorStop(1,'rgba(0,0,0,.58)');
      ctx.globalAlpha=hot?.88:.62+brightness*.22;
      ctx.fillStyle=shade;
      ctx.fillRect(x-r,y-r,r*2,r*2);

      // Glassy specular bloom, slightly animated so larger active worlds feel alive.
      const hx=x-r*.38+drift, hy=y-r*.43-drift*.25;
      const spec=ctx.createRadialGradient(hx,hy,0,hx,hy,r*.58);
      spec.addColorStop(0,'rgba(255,255,255,.92)');
      spec.addColorStop(.20,'rgba(255,255,255,.48)');
      spec.addColorStop(.55,'rgba(255,255,255,.10)');
      spec.addColorStop(1,'rgba(255,255,255,0)');
      ctx.globalAlpha=.32+brightness*.42+(hot?.16:0);
      ctx.fillStyle=spec;
      ctx.fillRect(x-r,y-r,r*2,r*2);

      // Subtle reflected light on the lower-right edge prevents the dark side from collapsing to black.
      const bounce=ctx.createRadialGradient(x+r*.55,y+r*.52,0,x+r*.55,y+r*.52,r*.62);
      bounce.addColorStop(0,rgba(color,.24+brightness*.15));
      bounce.addColorStop(1,rgba(color,0));
      ctx.globalAlpha=.55;
      ctx.fillStyle=bounce;
      ctx.fillRect(x-r,y-r,r*2,r*2);
      ctx.restore();

      // Rim and a short bright arc make the silhouette read as a sphere even at small mobile sizes.
      ctx.save();
      ctx.globalAlpha=hot?1:.30+brightness*.58;
      ctx.strokeStyle=hot?'rgba(255,255,255,.94)':rgba(color,.92);
      ctx.lineWidth=hot?1.6:1;
      ctx.beginPath(); ctx.arc(x,y,r+.8,0,Math.PI*2); ctx.stroke();
      ctx.globalAlpha=hot?.92:.24+brightness*.32;
      ctx.strokeStyle='rgba(255,255,255,.92)';
      ctx.lineWidth=Math.max(.8,r*.055);
      ctx.beginPath(); ctx.arc(x,y,r*.84,Math.PI*1.08,Math.PI*1.56); ctx.stroke();
      ctx.restore();

      if(hot){
        ctx.strokeStyle=rgba(color,.48);
        ctx.lineWidth=1;
        ctx.beginPath();
        ctx.arc(x,y,r+10+(reduceMotion?0:Math.sin(now*.004)*2),0,Math.PI*2);
        ctx.stroke();
      }
    }

    function drawNodes(now){
      ctx.textAlign='center';
      projects.forEach((p,i)=>{
        const q=nodePos(p,now); p._x=q.x; p._y=q.y;
        const hot=hovered===p || selected===p;
        const base=W<760?9.5:12;
        const fullRadius=base*p.r+(hot?2.5:0);
        const radius=fullRadius*.5;
        p._hit=Math.max(22,fullRadius+8);

        drawPlanetBall(q.x,q.y,radius,fullRadius,p.color,p.b,hot,now,i+1);

        const showLabel = hot || W>=760 || p.r>=1.5;
        if(showLabel){
          const label=p.label || p.name;
          const lines=wrapLabel(label,W<760?8:11);
          const fontSize=W<760?(p.r>=1.5?9:8):(p.r>=1.5?11:9);
          ctx.font=`${hot?850:700} ${fontSize}px Inter, "Noto Sans TC", sans-serif`;
          ctx.fillStyle=hot?'#fff':`rgba(225,235,246,${.28+p.b*.64})`;
          lines.forEach((line,idx)=>ctx.fillText(line,q.x,q.y+radius+13+idx*(fontSize+2)));
        }
        ctx.font='700 7px ui-monospace, monospace';
        ctx.fillStyle=hot?p.color:`rgba(126,148,174,${.18+p.b*.5})`;
        ctx.fillText(String(i+1).padStart(2,'0'),q.x,q.y-radius-9);
      });
    }

    function drawDust(now){
      const S=worldScale();
      ctx.save();
      particles.forEach((p,i)=>{
        if(!reduceMotion) p.a += p.s;
        const d=S*(.08+p.d*.44); const x=cx+offsetX+Math.cos(p.a)*d*.92, y=cy+offsetY+Math.sin(p.a)*d*.80;
        ctx.globalAlpha=.12+p.d*.28; ctx.fillStyle=i%4===0?'#b58cff':'#7be8ff'; ctx.beginPath(); ctx.arc(x,y,.6+p.d*1.1,0,Math.PI*2); ctx.fill();
      });
      ctx.restore();
    }

    function render(now){
      t=now; ctx.clearRect(0,0,W,H);
      drawStars(now); drawNebula(); drawOrbits(); drawConnections(now); drawDust(now); drawCore(now); drawNodes(now);
      requestAnimationFrame(render);
    }

    function hitTest(x,y){
      for(let i=projects.length-1;i>=0;i--){ const p=projects[i]; if(Math.hypot(x-p._x,y-p._y)<=p._hit) return p; }
      const core={_x:cx+offsetX,_y:cy+offsetY}; if(Math.hypot(x-core._x,y-core._y)<48) return {core:true};
      return null;
    }

    function showProject(p){
      selected=p; panelTitle.textContent=p.name; panelDesc.textContent=p.short;
      panelMeta.innerHTML=`<span class="chip">${p.type}</span><span class="chip">${p.status}</span>`;
      if(p.link){ panelLink.hidden=false; panelLink.href=p.link; panelLink.textContent=p.status==='DOWNLOAD'?'DOWNLOAD':'OPEN'; }
      else { panelLink.hidden=true; panelLink.removeAttribute('href'); }
      panel.classList.add('show');
    }
    function hidePanel(){ selected=null; panel.classList.remove('show'); }
    panelClose.addEventListener('click',hidePanel);

    canvas.addEventListener('pointerdown',e=>{ dragging=true; moved=false; lastX=startX=e.clientX; lastY=startY=e.clientY; canvas.setPointerCapture(e.pointerId); });
    canvas.addEventListener('pointermove',e=>{
      if(dragging){
        const dx=e.clientX-lastX, dy=e.clientY-lastY; if(Math.hypot(e.clientX-startX,e.clientY-startY)>5) moved=true;
        offsetX+=dx; offsetY+=dy; lastX=e.clientX; lastY=e.clientY;
        const limX=W*.20, limY=H*.16; offsetX=Math.max(-limX,Math.min(limX,offsetX)); offsetY=Math.max(-limY,Math.min(limY,offsetY));
      } else hovered=hitTest(e.clientX,e.clientY);
    });
    canvas.addEventListener('pointerup',e=>{ dragging=false; try{canvas.releasePointerCapture(e.pointerId)}catch{} if(!moved){ const hit=hitTest(e.clientX,e.clientY); if(hit?.core) hidePanel(); else if(hit) showProject(hit); } });
    canvas.addEventListener('pointercancel',()=>dragging=false);
    canvas.addEventListener('wheel',e=>{ e.preventDefault(); zoom=Math.max(.78,Math.min(1.22,zoom-e.deltaY*.0005)); },{passive:false});
    canvas.addEventListener('dblclick',()=>{ offsetX=0; offsetY=0; zoom=1; });
    canvas.addEventListener('mouseleave',()=>{ if(!dragging) hovered=null; });

    resize(); addEventListener('resize',resize); requestAnimationFrame(render);
  </script>
</body>
</html>
