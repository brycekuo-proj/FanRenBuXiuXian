<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#0a0805" />
  <title>凡人不修仙</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;500;700&family=Ma+Shan+Zheng&display=swap');

    :root {
      --bg: #0a0805;
      --bg2: #151007;
      --ink: #c9a96e;
      --ink-strong: #e0bd7c;
      --muted: #7a6040;
      --dim: #4f3921;
      --line: rgba(180, 130, 50, 0.22);
      --line-strong: rgba(180, 120, 40, 0.55);
      --danger: #9d3c24;
      --danger-soft: rgba(100, 28, 16, 0.34);
      --green: #8aab6a;
      --paper: rgba(18, 12, 4, 0.88);
      --paper2: rgba(30, 20, 8, 0.92);
    }

    * { box-sizing: border-box; }

    html, body {
      margin: 0;
      width: 100%;
      min-height: 100%;
      background: #050403;
      color: var(--ink);
      font-family: 'Noto Serif TC', 'Songti TC', 'PMingLiU', serif;
      -webkit-font-smoothing: antialiased;
      text-rendering: optimizeLegibility;
    }

    body {
      min-height: 100vh;
      overflow: hidden;
    }

    button {
      font: inherit;
      -webkit-tap-highlight-color: transparent;
    }

    .game-root {
      --story-font-size: 15px;
      --choice-font-size: 14px;
      --story-line-height: 2.02;
      width: 100%;
      max-width: 460px;
      height: 100vh;
      min-height: 100vh;
      margin: 0 auto;
      display: flex;
      flex-direction: column;
      position: relative;
      overflow: hidden;
      background:
        radial-gradient(ellipse at 50% 0%, rgba(180, 120, 30, 0.12) 0%, transparent 58%),
        radial-gradient(ellipse at 50% 100%, rgba(90, 28, 16, 0.13) 0%, transparent 55%),
        repeating-linear-gradient(0deg, transparent, transparent 40px, rgba(160, 120, 50, 0.035) 40px, rgba(160, 120, 50, 0.035) 41px),
        linear-gradient(180deg, #151007 0%, #0a0805 56%, #050403 100%);
    }

    .game-root.font-small {
      --story-font-size: 14px;
      --choice-font-size: 13px;
      --story-line-height: 1.95;
    }

    .game-root.font-medium {
      --story-font-size: 15px;
      --choice-font-size: 14px;
      --story-line-height: 2.02;
    }

    .game-root.font-large {
      --story-font-size: 18px;
      --choice-font-size: 16px;
      --story-line-height: 2.08;
    }

    .game-root::before {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      background:
        linear-gradient(90deg, rgba(0,0,0,.45), transparent 18%, transparent 82%, rgba(0,0,0,.45)),
        radial-gradient(circle at 30% 20%, rgba(197, 144, 69, .05), transparent 25%),
        radial-gradient(circle at 80% 70%, rgba(143, 48, 22, .05), transparent 28%);
      z-index: 0;
    }

    .game-root::after {
      content: '';
      position: absolute;
      inset: 0;
      pointer-events: none;
      opacity: .13;
      background-image:
        linear-gradient(115deg, transparent 0 48%, rgba(255,255,255,.08) 49%, transparent 50% 100%),
        linear-gradient(0deg, transparent 0 88%, rgba(0,0,0,.35) 89%, transparent 92%);
      background-size: 180px 180px, 100% 7px;
      mix-blend-mode: screen;
      z-index: 0;
    }

    .game-header {
      flex: 0 0 auto;
      padding: max(12px, env(safe-area-inset-top)) 16px 9px;
      border-bottom: 1px solid var(--line);
      position: relative;
      z-index: 2;
      background: rgba(10, 8, 5, 0.74);
      backdrop-filter: blur(8px);
    }

    .game-title-bar {
      font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
      font-size: 15px;
      color: #8b6914;
      letter-spacing: 0.16em;
      text-align: center;
      margin-bottom: 7px;
      text-shadow: 0 0 14px rgba(139, 105, 20, .2);
    }

    .game-status {
      display: flex;
      justify-content: center;
      gap: 10px;
      flex-wrap: wrap;
    }

    .font-controls {
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      margin-top: 8px;
      color: #6b4f28;
      font-size: 11px;
      letter-spacing: .12em;
    }

    .font-controls span {
      margin-right: 2px;
      white-space: nowrap;
    }

    .font-btn {
      min-width: 34px;
      min-height: 30px;
      padding: 4px 8px;
      border: 1px solid rgba(130, 90, 34, .24);
      background: rgba(16, 10, 4, .42);
      color: #8c6b3a;
      cursor: pointer;
      letter-spacing: .08em;
    }

    .font-btn[aria-pressed="true"] {
      color: #d2aa62;
      border-color: rgba(200, 145, 60, .68);
      background: rgba(62, 38, 11, .62);
    }

    .font-btn:focus-visible {
      outline: 2px solid rgba(210,150,60,.78);
      outline-offset: 2px;
    }

    .stat {
      min-height: 23px;
      padding: 4px 7px;
      border: 1px solid rgba(130, 90, 34, .18);
      background: rgba(16, 10, 4, .42);
      color: var(--muted);
      font-size: 11px;
      letter-spacing: 0.06em;
      line-height: 1.2;
    }

    .stat strong { color: #b78b4a; font-weight: 500; }

    .game-content {
      flex: 1 1 auto;
      overflow-y: auto;
      padding: 20px 20px max(112px, calc(env(safe-area-inset-bottom) + 92px));
      position: relative;
      z-index: 1;
      scroll-behavior: smooth;
    }

    .game-content::-webkit-scrollbar { width: 4px; }
    .game-content::-webkit-scrollbar-track { background: rgba(0,0,0,.24); }
    .game-content::-webkit-scrollbar-thumb { background: rgba(180,130,50,.26); border-radius: 2px; }

    .scene-chapter {
      font-size: 11px;
      color: #6b4f28;
      letter-spacing: .25em;
      text-align: center;
      margin-bottom: 6px;
    }

    .scene-title {
      font-family: 'Ma Shan Zheng', 'Noto Serif TC', serif;
      font-size: 25px;
      font-weight: 400;
      color: var(--ink-strong);
      text-align: center;
      letter-spacing: .18em;
      margin: 0 0 18px;
      text-shadow: 0 0 18px rgba(180, 120, 40, .16);
    }

    .scene-rule {
      width: 88px;
      height: 1px;
      margin: 0 auto 22px;
      background: linear-gradient(90deg, transparent, rgba(180, 120, 40, .5), transparent);
    }

    .scene-paragraphs {
      display: flex;
      flex-direction: column;
      gap: 14px;
      margin-bottom: 24px;
    }

    .scene-paragraph {
      margin: 0;
      font-size: var(--story-font-size);
      line-height: var(--story-line-height);
      color: #c5a06a;
      text-indent: 2em;
      letter-spacing: .045em;
      min-height: 1.8em;
      opacity: 0;
      transform: translateY(5px);
      transition: opacity .55s ease, transform .55s ease, color .55s ease;
    }

    .scene-paragraph.is-visible {
      opacity: 1;
      transform: translateY(0);
    }

    .scene-paragraph.is-typing::after {
      content: '▌';
      display: inline-block;
      margin-left: 2px;
      color: rgba(210, 160, 80, .9);
      animation: cursorBlink .88s steps(2, start) infinite;
    }

    .scene-paragraph.is-complete:first-line { color: #d4b080; }

    @keyframes cursorBlink { 50% { opacity: 0; } }

    .atmosphere-panel {
      margin: -8px 0 20px;
      border: 1px solid rgba(130, 90, 34, .22);
      background: linear-gradient(180deg, rgba(15, 9, 3, .72), rgba(26, 15, 5, .46));
      padding: 10px 12px 11px;
      box-shadow: inset 0 1px 0 rgba(220, 170, 80, .04), 0 10px 22px rgba(0,0,0,.16);
    }

    .atmosphere-top {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      margin-bottom: 8px;
    }

    .atmosphere-label {
      color: #6b4f28;
      font-size: 11px;
      letter-spacing: .22em;
      white-space: nowrap;
    }

    .reading-hint {
      min-width: 0;
      color: #5f4a2c;
      font-size: 11px;
      line-height: 1.4;
      text-align: right;
      letter-spacing: .06em;
    }

    .fate-meter {
      position: relative;
      height: 4px;
      overflow: hidden;
      background: rgba(60, 42, 18, .72);
      border-radius: 99px;
      box-shadow: inset 0 0 0 1px rgba(180, 130, 50, .08);
    }

    .fate-meter-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, rgba(110, 70, 25, .55), rgba(200, 143, 63, .82), rgba(120, 38, 20, .7));
      transition: width .62s ease;
      box-shadow: 0 0 12px rgba(190, 115, 45, .26);
    }

    .text-tools {
      display: flex;
      justify-content: center;
      margin-top: 11px;
    }

    .skip-text-btn {
      min-height: 34px;
      border: 1px solid rgba(150, 105, 40, .28);
      background: rgba(20, 12, 4, .72);
      color: #7f6238;
      padding: 6px 11px;
      font-size: 12px;
      letter-spacing: .08em;
      cursor: pointer;
    }

    .skip-text-btn:disabled {
      opacity: .46;
      cursor: default;
    }

    .choices-container {
      opacity: 0;
      transform: translateY(8px);
      animation: choicesEnter .46s ease forwards;
      padding-bottom: 52px;
      scroll-margin-top: 18px;
    }

    @keyframes choicesEnter {
      to { opacity: 1; transform: translateY(0); }
    }

    .auto-wait {
      margin: 20px auto 0;
      width: 42px;
      height: 42px;
      border: 1px solid rgba(130, 82, 30, .4);
      display: grid;
      place-items: center;
      color: #6b4f28;
      transform: rotate(45deg);
      animation: pulseSeal 1.1s ease-in-out infinite;
    }
    .auto-wait span { transform: rotate(-45deg); font-size: 12px; letter-spacing: .12em; }
    @keyframes pulseSeal { 50% { opacity: .45; } }

    .choices-container {
      display: flex;
      flex-direction: column;
      gap: 10px;
      margin-top: 8px;
    }

    .choices-label {
      color: #5a4020;
      font-size: 12px;
      letter-spacing: .22em;
      text-align: center;
      margin-bottom: 5px;
    }

    .choice-btn {
      width: 100%;
      min-height: 48px;
      padding: 12px 14px 12px 16px;
      border: 1px solid rgba(160, 110, 40, .35);
      border-left: 2px solid rgba(180, 120, 40, .65);
      color: #c5a06a;
      background: linear-gradient(135deg, rgba(30,20,8,.9), rgba(42,28,11,.92));
      text-align: left;
      cursor: pointer;
      line-height: 1.65;
      letter-spacing: .04em;
      box-shadow: inset 0 1px 0 rgba(200,150,60,.05), 0 2px 8px rgba(0,0,0,.35);
      transition: transform .18s ease, border-color .18s ease, color .18s ease, background .18s ease;
    }

    .choice-btn:focus-visible {
      outline: 2px solid rgba(210, 150, 60, .8);
      outline-offset: 3px;
    }

    @media (hover: hover) and (pointer: fine) {
      .choice-btn:hover {
        background: linear-gradient(135deg, rgba(50,33,10,.96), rgba(60,40,14,.96));
        border-color: rgba(200,140,50,.55);
        border-left-color: rgba(220,160,60,.9);
        color: #e0b870;
        transform: translateX(2px);
      }
    }

    .choice-btn:active { transform: translateX(1px); }
    .choice-number { color: #7a5a28; margin-right: 5px; font-size: 13px; }
    .choice-cost { display: block; margin-top: 3px; font-size: 11px; color: #7a5020; font-style: italic; }
    .choice-risk { color: #843b24; }

    .death-screen, .survival-screen {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 18px;
      padding-top: 76px;
    }

    .tombstone {
      width: 100%;
      max-width: 315px;
      margin: 0 auto;
      position: relative;
      background: linear-gradient(180deg, rgba(18,10,4,.96), rgba(22,14,6,.96));
      border: 1px solid rgba(100,60,30,.5);
      border-top: none;
      box-shadow: 0 0 30px rgba(0,0,0,.8), 0 0 60px rgba(100,30,10,.10);
    }

    .tombstone::before {
      content: '';
      position: absolute;
      left: -1px;
      right: -1px;
      top: -78px;
      height: 78px;
      border: 1px solid rgba(100,60,30,.5);
      border-bottom: none;
      border-radius: 50% 50% 0 0 / 60px 60px 0 0;
      background: linear-gradient(180deg, rgba(18,10,4,.96), rgba(18,10,4,.96));
    }

    .tombstone-inner {
      position: relative;
      z-index: 1;
      padding: 13px 20px 21px;
      text-align: center;
    }

    .tombstone-name {
      font-family: 'Ma Shan Zheng', serif;
      font-size: 22px;
      color: #c09050;
      letter-spacing: .14em;
      margin-bottom: 3px;
    }

    .tombstone-age {
      color: #6b4f28;
      font-size: 12px;
      letter-spacing: .12em;
      margin-bottom: 8px;
    }

    .tombstone-divider {
      color: #4a3518;
      font-size: 11px;
      letter-spacing: .32em;
      margin: 7px 0;
    }

    .tombstone-cause {
      color: #a07040;
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: .04em;
    }

    .tombstone-cause .label {
      display: block;
      color: #7a3a18;
      font-size: 11px;
      margin-bottom: 4px;
    }

    .tombstone-epitaph {
      white-space: pre-line;
      color: #805830;
      font-size: 12px;
      line-height: 1.8;
      letter-spacing: .04em;
    }

    .survival-card {
      width: 100%;
      border: 1px solid rgba(110, 130, 70, .35);
      border-left: 3px solid rgba(130, 170, 90, .7);
      background: linear-gradient(135deg, rgba(12,24,10,.72), rgba(18,12,4,.85));
      padding: 18px 18px;
      box-shadow: 0 0 28px rgba(0,0,0,.52);
    }

    .survival-title {
      color: var(--green);
      text-align: center;
      font-family: 'Ma Shan Zheng', serif;
      font-size: 23px;
      letter-spacing: .15em;
      margin-bottom: 6px;
      text-shadow: 0 0 16px rgba(80,120,50,.3);
    }

    .survival-subtitle {
      text-align: center;
      color: #4a6535;
      font-size: 11px;
      letter-spacing: .2em;
      margin-bottom: 14px;
    }

    .survival-card p {
      margin: 0 0 10px;
      color: #a4b382;
      font-size: 14px;
      line-height: 1.8;
      text-indent: 2em;
    }

    .closest-moment, .intel-box {
      width: 100%;
      border: 1px solid rgba(120,90,30,.3);
      border-left: 3px solid rgba(160,110,35,.65);
      background: rgba(18,12,4,.82);
      padding: 12px 15px;
    }

    .closest-moment-label, .intel-label {
      color: #6b4f20;
      font-size: 10px;
      letter-spacing: .25em;
      margin-bottom: 7px;
    }

    .closest-moment-text, .intel-text {
      color: #b08040;
      font-size: 13px;
      line-height: 1.75;
      letter-spacing: .05em;
      font-style: italic;
    }

    .footer-actions {
      width: 100%;
      display: grid;
      grid-template-columns: 1fr;
      gap: 10px;
      margin-top: 2px;
    }

    .restart-btn, .home-btn {
      min-height: 46px;
      padding: 11px 14px;
      cursor: pointer;
      letter-spacing: .12em;
      border: 1px solid rgba(160,110,40,.42);
      background: rgba(28,18,8,.86);
      color: #d0a865;
    }

    .restart-btn:focus-visible, .home-btn:focus-visible {
      outline: 2px solid rgba(210,150,60,.78);
      outline-offset: 3px;
    }

    .home-btn {
      color: #8e7350;
      border-color: rgba(120,80,30,.26);
      background: rgba(12,9,5,.72);
    }

    .missing {
      padding: 20px;
      border: 1px solid var(--danger);
      color: #d28a73;
      background: var(--danger-soft);
      line-height: 1.8;
    }

    @media (max-width: 380px) {
      .game-content { padding-left: 16px; padding-right: 16px; }
      .scene-title { font-size: 23px; }
      .game-root.font-small { --story-font-size: 13.5px; --choice-font-size: 12.8px; --story-line-height: 1.92; }
      .game-root.font-medium { --story-font-size: 14.5px; --choice-font-size: 13.5px; --story-line-height: 1.96; }
      .game-root.font-large { --story-font-size: 17px; --choice-font-size: 15.5px; --story-line-height: 2.04; }
    }

    @media (prefers-reduced-motion: reduce) {
      .scene-paragraph, .auto-wait { animation: none; opacity: 1; transform: none; }
      .game-content { scroll-behavior: auto; }
      .choice-btn { transition: none; }
    }
  </style>
</head>
<body>
  <main class="game-root" id="gameRoot">
    <header class="game-header" aria-label="遊戲狀態">
      <div class="game-title-bar" id="gameTitleBar">凡人不修仙：第一章</div>
      <div class="game-status" id="statusBar"></div>
      <div class="font-controls" aria-label="字體大小">
        <span>字體</span>
        <button class="font-btn" type="button" data-font-size="small" aria-pressed="false">小</button>
        <button class="font-btn" type="button" data-font-size="medium" aria-pressed="true">中</button>
        <button class="font-btn" type="button" data-font-size="large" aria-pressed="false">大</button>
      </div>
    </header>
    <section class="game-content" id="gameContent" aria-live="polite"></section>
  </main>

  <script src="data/runtime/chapter2_scenes.js"></script>
  <script>
    (() => {
      const INITIAL = Object.freeze({ coins: 3, qi: 80, deaths: 0, age: 17, closestMoment: '尚未摸到仙途' });

      const SCENES = {
        intro: {
          chapter: '序章',
          title: '命運的底牌',
          paragraphs: [
            '永靖二十三年，春。',
            '你叫王狗蛋，今年十七歲，生於永靖山下的柳溪村。村裡人說你有靈根——雜靈根，五行皆通，五行皆廢。',
            '你娘為此哭了一夜。不是感動，是覺得丟人。',
            '你坐在茅廁裡，手裡攥著三枚銅錢，認真思考人生的意義。',
            '忽然，村口傳來高呼：「青雲宗廣招雜役！包吃包住！月例三十文！」',
            '命運的大門悄然開了一條縫。不過，你還沒算過自己付不付得起開門費。'
          ],
          choices: [{ text: '起身，整理褲腰帶，迎接命運', next: 'life_roll' }]
        },
        life_roll: {
          chapter: '你的過去',
          title: '十七年',
          paragraphs: [
            '在你站上那個三岔路口之前，命運已悄悄出過幾張牌。',
            '有些人，還沒走到路口就已經輸了。'
          ],
          autoNext: 'start_choice',
          autoFailNext: 'early_trouble',
          autoNextProb: 0.68,
          waitMs: 1200
        },
        early_trouble: {
          chapter: '你的過去',
          title: '命運的底牌',
          paragraphs: [
            '你翻開自己的底牌，發現比想像中爛。',
            '修仙世界裡，有些死劫不是你選錯了，而是你出生時就被寫進了帳本。'
          ],
          choices: [
            { text: '幼年體弱，久病不起，大夫說你的經脈尚未完全成形', next: 'meridian_weak', qiDelta: -20, moment: '聽過大夫說「經脈」二字' },
            { text: '家裡欠了礦場三年的債，今年正好到了催討期', next: 'family_debt', coinDelta: -2, moment: '差一點被礦場買走' },
            { text: '三年前兩名修士在村外鬥法，餘波掃過你家土屋', next: 'battle_debris', qiDelta: -10, moment: '被修士鬥法餘波擦過' }
          ]
        },
        meridian_weak: {
          chapter: '幼年往事',
          title: '經脈未成',
          paragraphs: [
            '你七歲那年病了整整一個冬天，大夫搖著頭說：「這孩子能活下來算老天開恩，只是……」',
            '他沒有說完。',
            '你的父母後來才從另一個大夫口中得知：長年發熱損傷了你的經脈，靈氣難以在體內正常流轉。',
            '「有靈根，但經脈如同破篩。引氣入體？難如登天。」',
            '你現在十七歲了。你假裝沒聽見過那句話。'
          ],
          choices: [{ text: '就算如此，也要試試', next: 'start_choice_damaged' }]
        },
        family_debt: {
          chapter: '幼年往事',
          title: '礦場的賬',
          paragraphs: [
            '你爹三年前借了礦場老闆一兩銀子，說是「周轉一下」。',
            '今年，礦場的人來了，手裡拿著契書。',
            '「還不上錢，那就讓你兒子去礦場做三年工抵債。包吃住，不給工錢。」',
            '你爹把你推到門口，沒有說話。',
            '你娘哭了，但她的眼淚並沒有能力替你擦掉那份契書。'
          ],

      const root = document.getElementById('gameRoot');

      const statusBar = document.getElementById('statusBar');
      const gameTitleBar = document.getElementById('gameTitleBar');
      const fontButtons = Array.from(document.querySelectorAll('[data-font-size]'));
      let state = { ...INITIAL };
      let sceneKey = 'intro';
      let timer = null;
      let typingTimer = null;
      let runToken = 0;
      let activeReveal = null;
      const TYPE_DELAY_MS = 46;
      const PUNCTUATION_DELAY_MS = 260;
      const PARAGRAPH_PAUSE_MS = 720;

      function clearTimers() {
        clearTimeout(timer);
        clearTimeout(typingTimer);
        if (activeReveal) activeReveal.cancelled = true;
        activeReveal = null;
      }

      function setFontSize(size) {
        const safe = ['small', 'medium', 'large'].includes(size) ? size : 'medium';
        root.classList.remove('font-small', 'font-medium', 'font-large');
        root.classList.add(`font-${safe}`);
        fontButtons.forEach(button => {
          const pressed = button.getAttribute('data-font-size') === safe;
          button.setAttribute('aria-pressed', String(pressed));
        });
      }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function escapeHtml(text) {
        return String(text ?? '').replace(/[&<>'"]/g, ch => ({
          '&': '&amp;', '<': '&lt;', '>': '&gt;', "'": '&#39;', '"': '&quot;'
        }[ch]));
      }

      function applyChoice(choice) {
        if (!choice) return;
        state.coins = clamp(state.coins + (choice.coinDelta || 0), 0, 99);
        state.qi = clamp(state.qi + (choice.qiDelta || 0), 0, 120);
        if (choice.moment) state.closestMoment = choice.moment;
      }

      function updateStatus(scene) {
        const label = scene && scene.type === 'death' ? '已死' : scene && scene.type === 'survival' ? '存活' : '輪迴中';
        const bookChapter = scene && Number(scene.bookChapter) === 2 ? 2 : 1;
        if (gameTitleBar) gameTitleBar.textContent = `凡人不修仙：第${bookChapter === 2 ? '二' : '一'}章`;
        document.title = `凡人不修仙｜第${bookChapter === 2 ? '二' : '一'}章`;
        statusBar.innerHTML = `
          <span class="stat">銅錢 <strong>${state.coins}</strong></span>
          <span class="stat">氣血 <strong>${state.qi}</strong></span>
          <span class="stat">死數 <strong>${state.deaths}</strong></span>
          <span class="stat">狀態 <strong>${label}</strong></span>
        `;
      }

      function go(next) {
        if (!SCENES[next]) {
          renderMissing(next);
          return;
        }
        sceneKey = next;
        renderScene();
      }

      function pickWeighted(items) {
        if (!Array.isArray(items) || !items.length) return null;
        const normalized = items.map(item => ({ ...item, weight: Math.max(0, Number(item.weight) || 1) }));
        const total = normalized.reduce((sum, item) => sum + item.weight, 0);
        if (total <= 0) return normalized[0] && normalized[0].next;
        let roll = Math.random() * total;
        for (const item of normalized) {
          roll -= item.weight;
          if (roll <= 0) return item.next;
        }
        return normalized[normalized.length - 1].next;
      }

      function resolveChoiceNext(choice) {
        if (!choice) return null;
        if (Array.isArray(choice.nextPool) && choice.nextPool.length) return pickWeighted(choice.nextPool);
        return choice.next || null;
      }

      function choose(choice) {
        clearTimers();
        applyChoice(choice);
        const destination = resolveChoiceNext(choice);
        if (!destination) return renderMissing('choice-destination');
        go(destination);
      }

      function getRandomAuto(scene) {
        if (Array.isArray(scene.randomNexts) && scene.randomNexts.length) return pickWeighted(scene.randomNexts);
        if (!scene.autoNext) return null;
        if (typeof scene.autoNextProb === 'number' && scene.autoFailNext) {
          return Math.random() < scene.autoNextProb ? scene.autoNext : scene.autoFailNext;
        }
        return scene.autoNext;
      }

      function renderScene() {
        clearTimers();
        const token = ++runToken;
        const scene = SCENES[sceneKey];
        updateStatus(scene);
        if (!scene) return renderMissing(sceneKey);
        if (scene.closestMoment) state.closestMoment = scene.closestMoment;
        if (scene.type === 'death') return renderDeath(scene);
        if (scene.type === 'survival') return renderSurvival(scene);

        const paragraphs = Array.isArray(scene.paragraphs) ? scene.paragraphs : [];
        const choices = Array.isArray(scene.choices) ? scene.choices : [];

      function waitFor(ms, token, controller) {
        return new Promise(resolve => {
          if (controller.cancelled || token !== runToken || controller.skipAll) return resolve();
          timer = setTimeout(resolve, ms);
        });
      }

      function typeParagraph(node, text, token, controller) {
        return new Promise(resolve => {
          let idx = 0;
          let done = false;
          const finish = () => {
            if (done) return;
            done = true;
            clearTimeout(typingTimer);
            node.textContent = text;
            node.classList.remove('is-typing');
            node.classList.add('is-complete');
            resolve();
          };
          controller.finishCurrent = finish;
          node.classList.add('is-visible', 'is-typing');
          const step = () => {
            if (controller.cancelled || token !== runToken) return resolve();
            if (controller.skipAll) return finish();
            idx += 1;
            node.textContent = text.slice(0, idx);
            if (idx >= text.length) return finish();
            const prev = text[idx - 1] || '';
            const pause = '。！？；……'.includes(prev) ? PUNCTUATION_DELAY_MS : TYPE_DELAY_MS;
            typingTimer = setTimeout(step, pause);
          };
          step();
        });
      }

      async function revealSceneText({ scene, paragraphs, choices, token }) {
        const paragraphMount = content.querySelector('#paragraphMount');
        const choiceMount = content.querySelector('#choiceMount');
        const fill = content.querySelector('#fateMeterFill');
        const hint = content.querySelector('#readingHint');
        const skipBtn = content.querySelector('#skipTextBtn');
        const controller = { cancelled: false, skipAll: false, finishCurrent: null };
        const hasAutoOutcome = Boolean(scene.autoNext || (Array.isArray(scene.randomNexts) && scene.randomNexts.length));
        activeReveal = controller;
        if (skipBtn) {
          skipBtn.addEventListener('click', () => {
            controller.skipAll = true;
            if (controller.finishCurrent) controller.finishCurrent();
          });
        }
        for (let i = 0; i < paragraphs.length; i += 1) {
          if (controller.cancelled || token !== runToken) return;
          const node = document.createElement('p');
          node.className = 'scene-paragraph';
          paragraphMount.appendChild(node);
          await typeParagraph(node, String(paragraphs[i] ?? ''), token, controller);
          if (controller.cancelled || token !== runToken) return;
          if (fill) fill.style.width = `${Math.round(((i + 1) / Math.max(paragraphs.length, 1)) * 100)}%`;
          if (hint) hint.textContent = i + 1 >= paragraphs.length ? '正文已讀完，現在才輪到你。' : '文字仍在繼續，先別急著選。';
          content.scrollTo({ top: content.scrollHeight, behavior: controller.skipAll ? 'auto' : 'smooth' });
          await waitFor(PARAGRAPH_PAUSE_MS, token, controller);
        }
        if (controller.cancelled || token !== runToken) return;
        const tools = content.querySelector('.text-tools');
        if (tools) tools.hidden = true;
        if (hint) hint.textContent = hasAutoOutcome ? '正文已讀完，命運正在翻牌。' : '正文已讀完，請往下抉擇。';
        if (hasAutoOutcome) {
          choiceMount.innerHTML = '<div class="auto-wait" aria-label="命運正在翻牌"><span>命</span></div>';
        } else {
          choiceMount.innerHTML = renderChoices(choices);

          const firstChoice = choiceMount.querySelector('[data-choice-index="0"]');
          if (firstChoice) {
            setTimeout(() => firstChoice.scrollIntoView({ behavior: controller.skipAll ? 'auto' : 'smooth', block: 'center' }), 80);
          }
        }
        const autoDest = getRandomAuto(scene);
        if (autoDest) {
          timer = setTimeout(() => {
            if (token === runToken) go(autoDest);
          }, scene.waitMs || 1350);
        }
      }

            <div class="closest-moment"><div class="closest-moment-label">此生最接近仙途</div><div class="closest-moment-text">${escapeHtml(scene.closestMoment || state.closestMoment)}</div></div>
            <div class="footer-actions">
              ${scene.continueTo ? `<button class="restart-btn" type="button" id="continueBtn">${escapeHtml(scene.continueLabel || '繼續')}</button>` : ''}
              <button class="restart-btn" type="button" id="restartBtn">再投一世</button>
              <button class="home-btn" type="button" id="chapterBtn">回到三岔口</button>
            </div>
          </div>
        `;
        content.scrollTop = 0;
        const continueBtn = content.querySelector('#continueBtn');
        if (continueBtn && scene.continueTo) continueBtn.addEventListener('click', () => go(scene.continueTo));
        content.querySelector('#restartBtn').addEventListener('click', restart);
        content.querySelector('#chapterBtn').addEventListener('click', () => go('start_choice'));
      }

      function renderIntel(intel) {
        if (!intel) return '';
        return `<div class="intel-box"><div class="intel-label">死後情報 / 世界常識</div><div class="intel-text">${escapeHtml(intel)}</div></div>`;
      }

      function renderMissing(key) {
        updateStatus({});
        content.innerHTML = `
          <div class="missing">
            <strong>場景缺失：</strong>${escapeHtml(key)}<br>
            這不是世界規則，是程式還沒接好。請截圖回報。
          </div>
          <div class="footer-actions" style="margin-top:16px">
            <button class="restart-btn" type="button" id="restartBtn">再投一世</button>
          </div>
        `;
        content.querySelector('#restartBtn').addEventListener('click', restart);
      }

      function restart() {
        clearTimers();
        state = { ...INITIAL, deaths: state.deaths };
        sceneKey = 'intro';
        renderScene();
      }

      fontButtons.forEach(button => {
        button.addEventListener('click', () => setFontSize(button.getAttribute('data-font-size')));
      });
      setFontSize('medium');

      root.addEventListener('keydown', (event) => {
        if (event.target && /INPUT|TEXTAREA|SELECT/.test(event.target.tagName)) return;
        const n = Number(event.key);
        if (!Number.isInteger(n) || n < 1 || n > 9) return;
        const btn = content.querySelector(`[data-choice-index="${n - 1}"]`);
        if (btn) btn.click();
      });

      renderScene();
    })();
  </script>
</body>
</html>
