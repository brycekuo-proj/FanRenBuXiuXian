<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#100d0a" />
  <title>凡人不修仙｜第一章互動頁</title>
  <style>
    :root {
      --bg: #100d0a;
      --paper: #211a13;
      --paper-2: #17120e;
      --paper-3: #2b2117;
      --ink: #eadcc5;
      --muted: #a7957d;
      --dim: #726555;
      --line: #594733;
      --line-soft: rgba(180, 143, 91, .26);
      --gold: #c49a5a;
      --gold-2: #e4bd78;
      --danger: #a44d3e;
      --danger-soft: rgba(164, 77, 62, .16);
      --ok: #8aa36c;
      --shadow: rgba(0, 0, 0, .45);
    }
    * { box-sizing: border-box; }
    html, body { margin: 0; min-height: 100%; }
    body {
      background:
        radial-gradient(circle at 50% 8%, rgba(145, 102, 55, .16), transparent 34%),
        radial-gradient(circle at 15% 92%, rgba(107, 61, 41, .16), transparent 34%),
        linear-gradient(180deg, #15100c 0%, var(--bg) 62%, #090806 100%);
      color: var(--ink);
      font-family: "Noto Serif TC", "Songti TC", "PMingLiU", serif;
      line-height: 1.72;
    }
    button, a { font: inherit; }
    a { color: inherit; }
    .app {
      width: min(100%, 760px);
      margin: 0 auto;
      padding: max(18px, env(safe-area-inset-top)) 16px max(28px, env(safe-area-inset-bottom));
    }
    .screen { display: none; }
    .screen.active { display: block; }
    .topbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 18px;
    }
    .ghost-link, .small-btn {
      min-height: 42px;
      padding: 8px 12px;
      border: 1px solid var(--line-soft);
      background: rgba(22, 17, 13, .72);
      color: var(--muted);
      text-decoration: none;
      border-radius: 999px;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 6px;
      cursor: pointer;
    }
    .ghost-link:focus-visible, .small-btn:focus-visible, .chapter:focus-visible, .choice:focus-visible, .primary:focus-visible, .secondary:focus-visible {
      outline: 2px solid rgba(228, 189, 120, .75);
      outline-offset: 2px;
    }
    .seal {
      width: 48px;
      height: 48px;
      margin: 8px auto 18px;
      border: 1px solid rgba(143, 62, 50, .9);
      color: #d08d80;
      display: grid;
      place-items: center;
      transform: rotate(-3deg);
      letter-spacing: .15em;
      font-size: 13px;
      opacity: .9;
    }
    h1, h2, h3, p { margin-top: 0; }
    h1 {
      margin: 0;
      text-align: center;
      font-size: clamp(38px, 10vw, 62px);
      font-weight: 600;
      letter-spacing: .12em;
      text-indent: .12em;
      line-height: 1.15;
      text-shadow: 0 4px 24px var(--shadow);
    }
    .subtitle {
      margin: 12px auto 28px;
      text-align: center;
      color: var(--muted);
      font-size: 14px;
      letter-spacing: .22em;
    }
    .motto {
      margin: 0 0 24px;
      padding: 18px 20px;
      border-top: 1px solid var(--line);
      border-bottom: 1px solid var(--line);
      color: #bfb09b;
      text-align: center;
      font-size: 14px;
    }
    .motto strong { color: #d4b27e; font-weight: 500; }
    .chapters { display: grid; gap: 11px; }
    .chapter {
      appearance: none;
      width: 100%;
      min-height: 78px;
      display: grid;
      grid-template-columns: 58px 1fr auto;
      align-items: center;
      gap: 14px;
      padding: 13px 16px;
      border: 1px solid var(--line);
      background: linear-gradient(135deg, rgba(40, 31, 23, .95), rgba(23, 18, 14, .96));
      color: var(--ink);
      text-align: left;
      cursor: pointer;
      transition: transform .15s ease, border-color .15s ease, background .15s ease;
    }
    .chapter:not(.disabled):hover {
      transform: translateY(-1px);
      border-color: #846a48;
      background: linear-gradient(135deg, rgba(50, 39, 28, .98), rgba(25, 19, 14, .98));
    }
    .chapter.disabled { cursor: default; opacity: .55; }
    .chapter.disabled:hover { transform: none; }
    .num {
      width: 48px;
      height: 48px;
      display: grid;
      place-items: center;
      border: 1px solid #6a5238;
      color: var(--gold);
      font-size: 20px;
    }
    .copy b {
      display: block;
      margin-bottom: 5px;
      font-weight: 500;
      letter-spacing: .12em;
      font-size: 17px;
    }
    .copy span { display: block; color: var(--muted); font-size: 12px; line-height: 1.55; }
    .state { color: #b98f53; font-size: 12px; white-space: nowrap; }
    .disabled .state { color: #756958; }
    footer {
      margin-top: 26px;
      text-align: center;
      color: #62584b;
      font-size: 11px;
      letter-spacing: .12em;
      line-height: 1.8;
    }
    .hud {
      display: grid;
      gap: 12px;
      margin-bottom: 14px;
    }
    .run-card, .story-card, .result-card, .grave-card, .drawer {
      border: 1px solid var(--line-soft);
      background: linear-gradient(180deg, rgba(35, 27, 20, .94), rgba(18, 14, 11, .94));
      box-shadow: 0 16px 36px rgba(0, 0, 0, .18);
    }
    .run-card { padding: 13px 14px; }
    .run-meta {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
      margin-bottom: 10px;
    }
    .life-title { color: var(--gold-2); letter-spacing: .08em; }
    .stats {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .pill {
      border: 1px solid rgba(196, 154, 90, .28);
      background: rgba(11, 9, 7, .42);
      color: #cbb89c;
      padding: 5px 9px;
      border-radius: 999px;
      font-size: 12px;
      white-space: nowrap;
    }
    .pill.danger { color: #dc9a8e; border-color: rgba(164, 77, 62, .4); background: var(--danger-soft); }
    .progress {
      height: 5px;
      border: 1px solid rgba(196, 154, 90, .16);
      background: rgba(0, 0, 0, .24);
      overflow: hidden;
    }
    .progress span { display: block; height: 100%; width: 0%; background: linear-gradient(90deg, #7b5a34, var(--gold)); transition: width .25s ease; }
    .story-card { padding: 18px; }
    .kicker {
      color: var(--gold);
      font-size: 12px;
      letter-spacing: .16em;
      margin-bottom: 8px;
      text-transform: uppercase;
    }
    .story-card h2 {
      margin: 0 0 12px;
      font-size: clamp(22px, 6vw, 34px);
      line-height: 1.25;
      letter-spacing: .06em;
      font-weight: 500;
    }
    .story-text {
      color: #e3d2b8;
      font-size: 16px;
      white-space: pre-wrap;
    }
    .clues {
      margin: 16px 0 0;
      padding: 12px 14px;
      border-left: 2px solid rgba(196, 154, 90, .56);
      background: rgba(0, 0, 0, .2);
      color: #c4b39a;
      font-size: 14px;
    }
    .clues b { display: block; color: #d7bd8b; margin-bottom: 5px; font-weight: 500; }
    .choices {
      display: grid;
      gap: 10px;
      margin-top: 14px;
    }
    .choice {
      width: 100%;
      min-height: 56px;
      padding: 13px 14px;
      border: 1px solid rgba(196, 154, 90, .32);
      background: rgba(22, 17, 13, .9);
      color: var(--ink);
      text-align: left;
      cursor: pointer;
    }
    .choice:hover { border-color: rgba(228, 189, 120, .75); background: rgba(36, 27, 19, .96); }
    .choice small { display: block; margin-top: 3px; color: var(--dim); font-size: 12px; }
    .choice:disabled { opacity: .45; cursor: default; }
    .result-card {
      display: none;
      margin-top: 14px;
      padding: 16px;
      border-color: rgba(196, 154, 90, .35);
    }
    .result-card.active { display: block; }
    .result-card.death { border-color: rgba(164, 77, 62, .7); background: linear-gradient(180deg, rgba(54, 25, 20, .94), rgba(18, 14, 11, .96)); }
    .result-title { color: var(--gold-2); font-size: 18px; margin-bottom: 8px; }
    .result-card.death .result-title { color: #e0a094; }
    .result-text { white-space: pre-wrap; color: #dfcdb4; }
    .truth, .intel {
      margin-top: 12px;
      padding: 10px 12px;
      border: 1px solid rgba(196, 154, 90, .2);
      background: rgba(0, 0, 0, .2);
      color: #c7b596;
      font-size: 14px;
    }
    .actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }
    .primary, .secondary {
      min-height: 46px;
      border-radius: 0;
      padding: 10px 15px;
      cursor: pointer;
    }
    .primary {
      border: 1px solid rgba(228, 189, 120, .82);
      background: linear-gradient(135deg, rgba(114, 78, 40, .94), rgba(59, 39, 25, .96));
      color: #fff1d8;
    }
    .secondary {
      border: 1px solid var(--line-soft);
      background: rgba(16, 13, 10, .72);
      color: var(--muted);
    }
    .grave-card { padding: 18px; text-align: center; }
    .grave-seal {
      width: 58px;
      height: 58px;
      border: 1px solid rgba(164, 77, 62, .72);
      color: #d99b90;
      display: grid;
      place-items: center;
      margin: 4px auto 16px;
      letter-spacing: .15em;
    }
    .epitaph {
      margin: 0 auto 16px;
      max-width: 520px;
      color: #ead8bd;
      white-space: pre-wrap;
      font-size: 17px;
      line-height: 1.9;
    }
    .death-note {
      color: #b9a68c;
      border-top: 1px solid var(--line-soft);
      border-bottom: 1px solid var(--line-soft);
      padding: 12px 0;
      margin: 14px 0;
      white-space: pre-wrap;
    }
    .grave-card .actions { justify-content: center; }
    .drawer { margin-top: 14px; padding: 14px; color: #bca98e; font-size: 14px; }
    .drawer summary { cursor: pointer; color: var(--gold-2); min-height: 36px; display: flex; align-items: center; }
    .log-list { margin: 8px 0 0; padding-left: 20px; }
    .log-list li { margin: 4px 0; }
    .hidden { display: none !important; }
    @media (max-width: 430px) {
      .app { padding-left: 12px; padding-right: 12px; }
      .chapter { grid-template-columns: 48px 1fr; }
      .state { grid-column: 2; }
      .num { width: 42px; height: 42px; }
      .topbar { align-items: stretch; }
      .ghost-link, .small-btn { font-size: 13px; padding-left: 10px; padding-right: 10px; }
      .story-card, .grave-card { padding: 15px; }
      .actions > button, .actions > a { flex: 1 1 150px; }
    }
  </style>
</head>
<body>
  <main class="app" id="app">
    <section class="screen active" id="menuScreen" aria-labelledby="gameTitle">
      <div class="topbar">
        <a class="ghost-link" href="./index.html">← GAME POOL</a>
        <a class="ghost-link" href="./data/content/chapter1_full_text.md">正文主檔</a>
      </div>
      <div class="seal" aria-hidden="true">凡人</div>
      <h1 id="gameTitle">凡人不修仙</h1>
      <div class="subtitle">你以為活著就算贏了？</div>
      <div class="motto">
        <strong>自己死 ＞ 看別人死 ＞ 讓別人死</strong><br />
        每一次活下來，都可能只是讓你離「那個人」更近一步。
      </div>
      <section class="chapters" aria-label="章節選擇">
        <button class="chapter" type="button" id="startChapterButton">
          <span class="num">壹</span>
          <span class="copy"><b>第一章：村外有仙</b><span>投胎、進山、問仙、送死。這不是教學，是凡人的第一道篩選。</span></span>
          <span class="state">可遊玩</span>
        </button>
        <button class="chapter disabled" type="button" disabled>
          <span class="num">貳</span>
          <span class="copy"><b>第二章</b><span>仙門不要我。進門不是勝利，只是換一種死法。</span></span>
          <span class="state">開發中</span>
        </button>
        <button class="chapter disabled" type="button" disabled>
          <span class="num">參</span>
          <span class="copy"><b>第三章</b><span>修仙界想吃我。活著的人，開始看見別人怎麼死。</span></span>
          <span class="state">開發中</span>
        </button>
        <button class="chapter disabled" type="button" disabled>
          <span class="num">肆</span>
          <span class="copy"><b>第四章</b><span>打了小的來了老的——只是今天的小的，是你。</span></span>
          <span class="state">開發中</span>
        </button>
        <button class="chapter disabled" type="button" disabled>
          <span class="num">伍</span>
          <span class="copy"><b>第五章</b><span>弒龍者終成惡龍。</span></span>
          <span class="state">開發中</span>
        </button>
      </section>
      <footer>死亡不是答案提示。<br />你只能比上一世，更懂這個世界一點。</footer>
    </section>

    <section class="screen" id="gameScreen" aria-labelledby="chapterTitle">
      <div class="topbar">
        <button class="small-btn" type="button" id="backToMenuButton">← 章節</button>
        <button class="small-btn" type="button" id="restartRunButton">再投一世</button>
      </div>
      <div class="hud">
        <div class="run-card">
          <div class="run-meta">
            <span class="life-title" id="chapterTitle">第一章：村外有仙</span>
            <span id="runCounter">第 1 世</span>
          </div>
          <div class="stats" id="statsPanel" aria-label="目前狀態"></div>
          <div class="progress" aria-hidden="true"><span id="progressBar"></span></div>
        </div>
      </div>
      <article class="story-card" aria-live="polite">
        <div class="kicker" id="sceneKicker">投胎</div>
        <h2 id="sceneTitle">凡人入局</h2>
        <div class="story-text" id="storyText"></div>
        <div class="clues" id="clueBox"></div>
        <div class="choices" id="choiceList"></div>
        <div class="result-card" id="resultCard" aria-live="polite">
          <div class="result-title" id="resultTitle"></div>
          <div class="result-text" id="resultText"></div>
          <div class="truth" id="truthBox"></div>
          <div class="intel" id="intelBox"></div>
          <div class="actions" id="resultActions"></div>
        </div>
      </article>
      <details class="drawer">
        <summary>本世紀錄</summary>
        <ol class="log-list" id="runLog"></ol>
      </details>
    </section>

    <section class="screen" id="graveScreen" aria-labelledby="graveTitle">
      <div class="topbar">
        <button class="small-btn" type="button" id="graveMenuButton">← 章節</button>
        <button class="small-btn" type="button" id="graveRestartButton">再投一世</button>
      </div>
      <article class="grave-card" aria-live="polite">
        <div class="grave-seal" aria-hidden="true">墓</div>
        <div class="kicker" id="graveKicker">此世已結</div>
        <h2 id="graveTitle">墓誌銘</h2>
        <div class="epitaph" id="epitaphText"></div>
        <div class="death-note" id="deathNote"></div>
        <div class="intel" id="graveIntel"></div>
        <div class="actions">
          <button class="primary" type="button" id="graveRestartPrimary">再投一世</button>
          <button class="secondary" type="button" id="graveMenuSecondary">回章節選單</button>
        </div>
      </article>
      <details class="drawer" open>
        <summary>死前紀錄</summary>
        <ol class="log-list" id="graveLog"></ol>
      </details>
    </section>
  </main>

  <script>
    (() => {
      const root = document.getElementById('app');
      if (!root || root.dataset.ready === '1') return;
      root.dataset.ready = '1';

      const $ = (id) => document.getElementById(id);
      const screens = {
        menu: $('menuScreen'),
        game: $('gameScreen'),
        grave: $('graveScreen')
      };

      const intel = {
        family: '凡人的情報多半藏在家人的恐懼裡，不在修士的話術裡。',
        sweetFog: '山裡最香的草，通常不是給人吃的。',
        guarded: '真正的機緣旁邊，常常有真正能守住機緣的東西。',
        sect: '宗門不用殺你。它只要把門檻修得夠高，凡人自己就會倒在路上。',
        cheapChance: '主動給凡人機會的人，常常不是看見你的天分，而是看見你的便宜。',
        otherDeath: '有時候你活下來，不是因為你更聰明，而是因為有人比你早一步犯錯。',
        riskTransfer: '看見別人死，可以讓你多活一次。等你習慣這件事，修仙界就離你不遠了。',
        almost: '凡人最危險的時候，不是失敗，而是差一點成功。'
      };

      const epitaphs = {
        creek: '此地長眠著柳小春，享年三歲。\n他這一生離仙途最近的時候，\n是被村人說成「早登極樂」。',
        miasma: '此地長眠著李小年，享年十六。\n他終於採到了仙草。\n可惜仙草先採走了他的氣。',
        beast: '此地長眠著趙阿土，享年十八。\n他終於找到一株靈草。\n可惜那株草也早被別的東西找到了。',
        qingyun: '此地長眠著王狗蛋，享年十七。\n他死在第九十七級台階，\n離修仙夢想尚有三十九級之遙。',
        stone: '此地長眠著劉三，享年十九。\n青雲宗終於收下了他。\n同日，靈石庫也終於補上了人手。',
        pill: '此地長眠著周鐵柱，享年十七。\n他拜了一位散修為師。\n師父待他很好，\n每顆丹藥都讓他先吃。',
        bone: '此地長眠著何小山，享年十六。\n他以為自己遇見了貴人。\n後來才知道，\n貴的是他的骨頭。',
        mundane: '此地長眠著吳平安，享年六十三。\n他一生錯過四次仙緣，\n避開五場死劫。\n村人說他沒有出息。\n他的墳前草長得最好。',
        servant: '此地長眠著陳小滿，享年二十一。\n他終於進了青雲宗。\n只是族譜上寫的不是弟子，\n是雜役。',
        unknown: '此地長眠著一名凡人。\n他曾以為自己只差一步。\n後來才知道，\n那一步本來就不是給他走的。'
      };

      const profiles = [
        {
          id: 'ordinary', weight: 70, name: '山村少年',
          stats: { body: 2, silver: 3, debt: 1, bonds: 2, mountain: 0, sect: 0, injury: 0, greed: 0, caution: 0 },
          text: '你活到了十六歲。這在柳溪村不算稀奇，但也不算容易。你會挑水，會砍柴，會在春荒時把半碗粥喝得像一碗。你聽過仙人，也聽過進山不歸的人。只是十六歲的人總會覺得，別人的死法輪不到自己。'
        },
        {
          id: 'debt', weight: 20, name: '欠債之家',
          stats: { body: 2, silver: 1, debt: 4, bonds: 1, mountain: 0, sect: 0, injury: 0, greed: 1, caution: 0 },
          text: '你家欠了鎮上米鋪三兩七錢銀子。這個數字不大，卻足以讓母親在夜裡咳嗽時壓低聲音。你不是忽然想修仙，你只是忽然發現，不修仙的人也不一定能活。'
        },
        {
          id: 'weak', weight: 8, name: '病後餘命',
          stats: { body: 1, silver: 2, debt: 2, bonds: 2, mountain: 1, sect: 0, injury: 1, greed: 0, caution: 0 },
          text: '你小時候發過一場高燒。郎中說你命硬，卻沒說你身子好。你比同齡人更懂山路上哪裡能坐下喘氣，也更懂凡人想追上別人時，最先壞掉的通常不是志氣。'
        },
        {
          id: 'creek', weight: 2, name: '早夭', terminal: true,
          text: '你三歲那年追著紙鳶跑到溪邊。大人找到你時，紙鳶在柳枝上，你在水草裡。這一世沒有選項。柳溪村的人把這叫命薄，修士把這叫凡人。',
          death: { title: '開局殺', note: '有些人甚至活不到聽見仙字。', epitaph: epitaphs.creek, intel: intel.family }
        }
      ];

      const scenes = {
        mother: {
          line: '山村少年線', title: '母親阻止進山', baseDanger: 1,
          text: '清晨，你把柴刀磨亮，準備進山。母親坐在灶前，沒有抬頭，只問：你是不是又聽誰說山裡有仙草？\n\n鍋裡的粥很稀，灶火很小。她的聲音比灶灰還低。她不是第一次阻止你，但今天她把你的草鞋收進了屋裡。',

      const sceneOrder = ['mother', 'hunter', 'herb', 'mist', 'emptyPit', 'notice', 'test', 'labor', 'wanderer', 'pill'];
      let run = null;
      let runNumber = 0;

      function showScreen(name) {
        Object.values(screens).forEach((screen) => screen.classList.remove('active'));
        screens[name].classList.add('active');
        window.scrollTo({ top: 0, behavior: 'instant' in window ? 'instant' : 'auto' });
      }

      function clamp(value, min, max) {
        return Math.max(min, Math.min(max, value));
      }

      function weightedPick(items) {
        const total = items.reduce((sum, item) => sum + (item.weight || 1), 0);
        let roll = Math.random() * total;
        for (const item of items) {
          roll -= item.weight || 1;
          if (roll <= 0) return item;
        }
        return items[items.length - 1];
      }

      function pick(items) {
        return items[Math.floor(Math.random() * items.length)];
      }

      function applyEffects(effects) {
        if (!effects) return [];
        const labels = [];
        const labelMap = { body: '身體', silver: '銀錢', debt: '家債', bonds: '人情', mountain: '山識', sect: '宗門情報', injury: '傷病', greed: '貪念標記', caution: '謹慎代價' };
        for (const key of Object.keys(effects)) {
          const before = run.stats[key] || 0;
          run.stats[key] = clamp(before + effects[key], 0, key === 'silver' ? 10 : 5);
          const delta = run.stats[key] - before;
          if (delta !== 0) labels.push(`${labelMap[key] || key} ${delta > 0 ? '+' : ''}${delta}`);
        }
        return labels;
      }

      function riskModifiers() {
        let risk = 0;
        if (run.stats.body <= 1) risk += 1;
        if (run.stats.silver <= 1) risk += 1;
        if (run.stats.injury >= 2) risk += 2;
        if (run.stats.greed >= 3) risk += 1;
        if (run.stats.mountain >= 2) risk -= 1;
        if (run.stats.sect >= 2) risk -= 1;
        return risk;
      }

      function statPill(label, value, dangerWhen) {
        const danger = dangerWhen ? dangerWhen(value) : false;
        return `<span class="pill${danger ? ' danger' : ''}">${label} ${value}</span>`;
      }

      function renderStats() {
        const s = run.stats;
        $('statsPanel').innerHTML = [
          statPill('身體', s.body, (v) => v <= 1),
          statPill('銀錢', s.silver, (v) => v <= 1),
          statPill('家債', s.debt, (v) => v >= 4),
          statPill('人情', s.bonds, (v) => v <= 0),
          statPill('山識', s.mountain),
          statPill('宗門', s.sect),
          statPill('傷病', s.injury, (v) => v >= 2),
          statPill('標記', s.greed, (v) => v >= 3)
        ].join('');
        $('progressBar').style.width = `${clamp((run.steps / 5) * 100, 0, 100)}%`;
        $('runCounter').textContent = `第 ${runNumber} 世`;
      }

      function renderLog(targetId) {
        const target = $(targetId);
        target.innerHTML = run.log.map((item) => `<li>${escapeHtml(item)}</li>`).join('');
      }

      function escapeHtml(text) {
        return String(text).replace(/[&<>"]/g, (ch) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[ch]));
      }

      function startRun() {
        runNumber += 1;
        const profile = weightedPick(profiles);
        run = {
          profile,
          stats: { ...(profile.stats || {}) },
          steps: 0,
          sceneId: 'mother',
          truth: null,
          flags: { witness: false, transfer: false },
          log: []
        };
        if (profile.terminal) {
          run.log.push(profile.text);
          showGrave(profile.death);
          return;
        }
        showScreen('game');
        enterOpening(profile);
      }

      function enterOpening(profile) {
        $('sceneKicker').textContent = '投胎';
        $('sceneTitle').textContent = profile.name;
        $('storyText').textContent = profile.text;
        $('clueBox').innerHTML = '<b>本世底子</b>你不是空白角色。身體、銀錢、人情與家債，會決定同一個選項是不是送命。';
        $('choiceList').innerHTML = '<button class="choice" type="button" id="beginLifeButton">開始這一世<small>進入第一章事件池。</small></button>';
        $('resultCard').classList.remove('active', 'death');
        renderStats();
        renderLog('runLog');
        $('beginLifeButton').addEventListener('click', () => renderScene('mother'));
      }

      function renderScene(sceneId) {
        const scene = scenes[sceneId] || scenes.mother;
        run.sceneId = sceneId;
        run.truth = pick(scene.truths || [{ id: '普通危險', danger: 1, intel: 'family' }]);
        run.steps += 1;
        $('sceneKicker').textContent = scene.line;
        $('sceneTitle').textContent = scene.title;
        $('storyText').textContent = scene.text;
        const clueCount = clamp(2 + Math.floor((run.stats.mountain + run.stats.sect) / 3), 2, scene.clues.length);
        $('clueBox').innerHTML = `<b>可見徵兆</b>${scene.clues.slice(0, clueCount).join('<br>')}`;
        $('resultCard').classList.remove('active', 'death');
        $('resultTitle').textContent = '';
        $('resultText').textContent = '';
        $('truthBox').textContent = '';
        $('intelBox').textContent = '';
        $('resultActions').innerHTML = '';
        $('choiceList').innerHTML = '';
        scene.choices.forEach((choice, index) => {
          const btn = document.createElement('button');
          btn.className = 'choice';
          btn.type = 'button';
          btn.innerHTML = `${escapeHtml(choice.label)}<small>${escapeHtml(choice.hint || choice.strategy || '')}</small>`;
          btn.addEventListener('click', () => resolveChoice(choice, index));
          $('choiceList').appendChild(btn);
        });
        renderStats();
        renderLog('runLog');
      }

      function resolveChoice(choice) {
        const scene = scenes[run.sceneId];
        document.querySelectorAll('.choice').forEach((btn) => { btn.disabled = true; });
        if (choice.requires === 'mountain' && run.stats.mountain <= 0) {
          choice = { ...choice, risk: (choice.risk || 0) + 3, success: '你想檢查足跡，卻只看出泥很濕。凡人缺的不是眼睛，是知道該看哪裡。' };
        }
        const effectLabels = applyEffects(choice.effects);
        if (choice.flag === 'transfer') run.flags.transfer = true;
        if (choice.flag === 'witness') run.flags.witness = true;
        const risk = Math.max(0, scene.baseDanger + (run.truth.danger || 0) + (choice.risk || 0) + riskModifiers());
        const chance = clamp(risk / 12, 0.03, 0.88);
        const forceSafe = choice.ending === 'mundane';
        const died = !forceSafe && Math.random() < chance;
        run.log.push(`${scene.title}：${choice.label}`);
        renderStats();
        renderLog('runLog');
        if (died) {
          const death = chooseDeath(scene, run.truth);
          showResult(true, death.title, death.note, run.truth.id, death.intel, effectLabels, () => showGrave(death));
          return;
        }
        if (choice.ending) {
          const ending = endings[choice.ending] || endings.mundane;
          showResult(false, ending.title, `${choice.success}\n\n${ending.note}`, run.truth.id, ending.intel, effectLabels, () => showGrave({ title: ending.type, note: ending.note, epitaph: ending.epitaph, intel: ending.intel }));
          return;
        }
        const nextId = chooseNext(choice.next || nextCandidates(run.sceneId));
        let result = choice.success || '你暫時活了下來。但凡人活下來，通常只是進入下一個更貴的選項。';
        if (effectLabels.length) result += `\n\n狀態變化：${effectLabels.join('、')}`;
        showResult(false, '暫時活著', result, run.truth.id, intel[run.truth.intel] || intel.family, [], () => {
          if (run.steps >= 5) {
            const ending = chooseChapterEnding();
            showGrave({ title: ending.type, note: ending.note, epitaph: ending.epitaph, intel: ending.intel });
          } else {
            renderScene(nextId);
          }
        });
      }

      function chooseDeath(scene, truth) {
        if (truth.death && scene.deaths && scene.deaths[truth.death]) return scene.deaths[truth.death];
        if (scene.deaths) {
          const keys = Object.keys(scene.deaths);
          if (keys.length) return scene.deaths[pick(keys)];
        }
        return { title: '死於資訊差', note: '你不是完全沒有選擇。你只是沒有足夠的錢、命、時間與情報，去承擔選錯的代價。', epitaph: epitaphs.unknown, intel: intel.family };
      }

      function nextCandidates(sceneId) {
        const index = sceneOrder.indexOf(sceneId);
        const later = sceneOrder.slice(Math.max(0, index + 1));
        return later.length ? later.slice(0, 3) : ['notice', 'wanderer'];
      }

      function chooseNext(candidates) {
        const valid = candidates.filter((id) => scenes[id]);
        return valid.length ? pick(valid) : 'notice';
      }

      function chooseChapterEnding() {
        if (run.flags.transfer) return { ...endings.servant, intel: intel.riskTransfer };
        if (run.stats.injury >= 3) return endings.damaged;
        if (run.stats.sect >= 2 && run.stats.body >= 2) return endings.servant;
        if (run.stats.mountain >= 2 && run.stats.greed <= 1) return endings.mundane;
        return pick([endings.mundane, endings.damaged, endings.servant]);
      }

      function showResult(isDeath, title, text, truthText, intelText, effectLabels, nextAction) {
        const card = $('resultCard');
        card.classList.add('active');
        card.classList.toggle('death', Boolean(isDeath));
        $('resultTitle').textContent = isDeath ? `死劫：${title}` : title;
        let output = text;
        if (effectLabels && effectLabels.length) output += `\n\n狀態變化：${effectLabels.join('、')}`;
        $('resultText').textContent = output;
        $('truthBox').textContent = `本次背後真相：${truthText}`;
        $('intelBox').textContent = `死後/事後情報：${intelText}`;
        $('resultActions').innerHTML = '';
        const btn = document.createElement('button');
        btn.type = 'button';
        btn.className = isDeath ? 'primary' : 'primary';
        btn.textContent = isDeath ? '立碑' : '繼續';
        btn.addEventListener('click', nextAction);
        $('resultActions').appendChild(btn);
      }

      function showGrave(data) {
        showScreen('grave');
        $('graveKicker').textContent = data.title || '此世已結';
        $('epitaphText').textContent = data.epitaph || epitaphs.unknown;
        $('deathNote').textContent = data.note || '此世已結。';
        $('graveIntel').textContent = `世界情報：${data.intel || intel.family}`;
        renderLog('graveLog');
      }

      $('startChapterButton').addEventListener('click', startRun);
      $('restartRunButton').addEventListener('click', startRun);
      $('graveRestartButton').addEventListener('click', startRun);
      $('graveRestartPrimary').addEventListener('click', startRun);
      $('backToMenuButton').addEventListener('click', () => showScreen('menu'));
      $('graveMenuButton').addEventListener('click', () => showScreen('menu'));
      $('graveMenuSecondary').addEventListener('click', () => showScreen('menu'));
    })();
  </script>
</body>
</html>
